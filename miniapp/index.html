<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fa">
  <title>AQL ZIYOSI — Transport</title>
  <link rel="stylesheet" href="./style.css?v=parent-sections-3">
  <script src="https://telegram.org/js/telegram-web-app.js?64"></script>
  <script defer src="./app.js?v=parent-sections-3"></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="topbar-spacer" aria-hidden="true"></div>
      <div class="brand-identity">
        <div class="brand-logo-frame">
          <img class="brand-logo" src="./assets/aql-ziyosi-logo.png" alt="AQL ZIYOSI o‘quv markazi">
        </div>
        <p class="brand-caption"><span aria-hidden="true"></span>Transport xizmati</p>
      </div>
      <button id="refresh" class="icon-button" type="button" aria-label="Yangilash" title="Yangilash">↻</button>
    </header>

    <section class="welcome-card">
      <div>
        <p id="date" class="eyebrow">Bugungi ma’lumot</p>
        <h2 id="welcome">Assalomu alaykum</h2>
        <p id="role-label" class="muted">Ma’lumot yuklanmoqda…</p>
      </div>
      <div class="welcome-icon" aria-hidden="true">🚐</div>
    </section>

    <div id="notice" class="notice" hidden></div>
    <section id="content" class="content" aria-live="polite">
      <div class="loading"><span class="spinner"></span><span>Ma’lumot yuklanmoqda…</span></div>
    </section>
    <footer>Ma’lumotlar botning himoyalangan bazasidan olinadi.</footer>
  </main>
</body>
</html>
